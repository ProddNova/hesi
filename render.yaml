services:
  - type: web
    name: shutoko-nights
    runtime: static
    # Stamps the deployed commit into the service-worker cache name and the
    # entry module's ?v= query, so every deploy invalidates the previous one
    # without anyone editing sw.js or index.html by hand. See
    # scripts/stamp-build.mjs — it exits non-zero if its patterns stop
    # matching, which fails the deploy rather than shipping it unstamped.
    buildCommand: node scripts/stamp-build.mjs
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Editor textures are content-hashed (name changes when pixels change),
      # so browsers can cache them forever without ever seeing stale images.
      - path: /data/editor/textures/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
